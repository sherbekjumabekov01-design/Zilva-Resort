name: CI/CD Pipeline — Zilva Resort

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. Build & Test Backend (.NET 10)
  build-backend:
    name: Build & Test Backend (.NET 10)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore backend/ZilvaResort.Api.csproj

    - name: Build Backend
      run: dotnet build backend/ZilvaResort.Api.csproj --no-restore -c Release

  # 2. Build Frontend (Next.js 16)
  build-frontend:
    name: Build Frontend (Next.js 16)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Next.js
      run: |
        cd frontend
        npm run build
      env:
        NEXT_TELEMETRY_DISABLED: 1

  # 3. Docker Containers Validation
  docker-build:
    name: Validate Docker Compose
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Compose Images
      run: docker compose build
